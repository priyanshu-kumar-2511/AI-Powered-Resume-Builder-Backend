server:
  port: 8080

spring:
  application:
    name: API-GATEWAY
  config:
    import:
      - optional:configserver:http://localhost:8888
      - optional:file:../.env
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:4200"
                  - "http://127.0.0.1:4200"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
          routes:
            # Separate docs route so AUTH-SERVICE spec does not collide with gateway docs
            - id: auth-swagger-route
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/v3/api-docs, /api/v1/auth/v3/api-docs/**
              filters:
                - RewritePath=/api/v1/auth/(?<segment>.*), /${segment}
                - SetRequestHeader=X-Forwarded-Prefix, /api/v1/auth

            # Route for Authentication and Admin
            - id: auth-api-route
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**, /api/v1/admin/**

            # Explicit Route for Payments (Migrated to PAYMENT-SERVICE)
            - id: payment-api-route
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/v1/payments/**

            # Route for OAuth2 Login and Callbacks
            - id: oauth2-route
              uri: http://localhost:8081
              predicates:
                - Path=/oauth2/**, /login/**

            # Route for Documentation
            - id: swagger-route
              uri: http://localhost:8081
              predicates:
                - Path=/swagger-ui/**, /v3/api-docs/**, /swagger-ui.html

            - id: resume-service
              uri: lb://resume-service
              predicates:
                - Path=/api/v1/resumes/**
              filters:
                - RewritePath=/api/v1/resumes/?(?<segment>.*), /${segment}
                - SetRequestHeader=X-Forwarded-Prefix, /api/v1/resumes

            - id: section-service
              uri: lb://section-service
              predicates:
                - Path=/api/v1/sections/**
              filters:
                - RewritePath=/api/v1/sections/?(?<segment>.*), /${segment}
                - SetRequestHeader=X-Forwarded-Prefix, /api/v1/sections

            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/api/v1/ai/**
              filters:
                - RewritePath=/api/v1/ai/?(?<segment>.*), /${segment}
                - SetRequestHeader=X-Forwarded-Prefix, /api/v1/ai

            - id: template-service
              uri: lb://template-service
              predicates:
                - Path=/api/v1/templates/**
              filters:
                - RewritePath=/api/v1/templates/?(?<segment>.*), /${segment}
                - SetRequestHeader=X-Forwarded-Prefix, /api/v1/templates

            - id: export-service
              uri: lb://export-service
              predicates:
                - Path=/api/v1/exports/**
              filters:
                - RewritePath=/api/v1/exports/?(?<segment>.*), /${segment}
                - SetRequestHeader=X-Forwarded-Prefix, /api/v1/exports

            - id: notification-service
              uri: http://localhost:8087
              predicates:
                - Path=/api/v1/notifications/**
              filters:
                - RewritePath=/api/v1/notifications/?(?<segment>.*), /${segment}
                - SetRequestHeader=X-Forwarded-Prefix, /api/v1/notifications

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
    appname: API-GATEWAY

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: AUTH-SERVICE
        url: /api/v1/auth/v3/api-docs
      - name: TEMPLATE-SERVICE
        url: /api/v1/templates/v3/api-docs
      - name: RESUME-SERVICE
        url: /api/v1/resumes/v3/api-docs
      - name: SECTION-SERVICE
        url: /api/v1/sections/v3/api-docs
      - name: AI-SERVICE
        url: /api/v1/ai/v3/api-docs
      - name: EXPORT-SERVICE
        url: /api/v1/exports/v3/api-docs
      - name: NOTIFICATION-SERVICE
        url: /api/v1/notifications/v3/api-docs
      - name: PAYMENT-SERVICE
        url: /api/v1/payments/v3/api-docs
  api-docs:
    path: /v3/api-docs
