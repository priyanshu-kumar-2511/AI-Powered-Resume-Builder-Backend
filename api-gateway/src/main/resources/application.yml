server:
  port: 8080

spring:
  application:
    name: API-GATEWAY
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:4200"
                allowedMethods: "GET,POST,PUT,DELETE,OPTIONS"
                allowedHeaders: "*"
                allowCredentials: true
          routes:
            # Route for Authentication APIs
            - id: auth-api-route
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**, /api/v1/admin/**

            # Route for OAuth2 Login and Callbacks
            - id: oauth2-route
              uri: http://localhost:8081
              predicates:
                - Path=/oauth2/**, /login/**

            # Route for Documentation
            - id: swagger-route
              uri: http://localhost:8081
              predicates:
                - Path=/swagger-ui/**, /v3/api-docs/**, /swagger-ui.html

            - id: resume-service
              uri: lb://resume-service
              predicates:
                - Path=/api/v1/resumes/**

            - id: section-service
              uri: lb://section-service
              predicates:
                - Path=/api/v1/sections/**

            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/api/v1/ai/**

            - id: template-service
              uri: lb://template-service
              predicates:
                - Path=/api/v1/templates/**

            - id: export-service
              uri: lb://export-service
              predicates:
                - Path=/api/v1/exports/**

            - id: jobmatch-service
              uri: lb://jobmatch-service
              predicates:
                - Path=/api/v1/job-matches/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
    appname: API-GATEWAY

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
