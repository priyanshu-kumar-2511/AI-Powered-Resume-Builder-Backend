server:
  port: 8761

spring:
  application:
    name: EUREKA-SERVER
  boot:
    admin:
      client:
        url: http://localhost:9090
        instance:
          name: EUREKA-SERVER
          # Force registration using IP instead of machine hostname
          service-base-url: http://localhost:8761

eureka:
  instance:
    hostname: localhost
    appname: EUREKA-SERVER
  client:
    # Eureka server must not register itself as a client
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    # Eliminates the startup delay when no clients have registered yet
    wait-time-in-ms-when-sync-empty: 0

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always