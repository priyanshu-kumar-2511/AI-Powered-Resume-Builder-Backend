server:
  port: 0

spring:
  application:
    name: AI-SERVICE-TEST
  
  cloud:
    config:
      enabled: false
  
  datasource:
    url: jdbc:h2:mem:aidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  ai:
    openai:
      api-key: mock-api-key

eureka:
  client:
    enabled: false

app:
  jwt:
    secret: test-secret-key-for-unit-tests-only-32chars!!
    expiration: 86400000
