server:
  port: 0

spring:
  application:
    name: NOTIFICATION-SERVICE-TEST
  
  cloud:
    config:
      enabled: false
  
  datasource:
    url: jdbc:h2:mem:notifdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  mail:
    host: localhost
    port: 25
    username: testuser
    password: testpassword
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

eureka:
  client:
    enabled: false

app:
  jwt:
    secret: test-secret-key-for-unit-tests-only-32chars!!
    expiration: 86400000
