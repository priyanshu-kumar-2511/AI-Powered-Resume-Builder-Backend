server:
  port: 8761

spring:
  application:
    name: EUREKA-SERVER
  boot:
    admin:
      client:
        url: ${ADMIN_SERVER_URL:http://localhost:9090}
        username: ${ADMIN_USERNAME}
        password: ${ADMIN_PASSWORD}
        instance:
          name: EUREKA-SERVER
          service-base-url: ${EUREKA_BASE_URL:http://localhost:8761}

eureka:
  instance:
    hostname: localhost
    appname: EUREKA-SERVER
  client:
    # Eureka server must not register itself as a client
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  server:
    # Eliminates the startup delay when no clients have registered yet
    wait-time-in-ms-when-sync-empty: 0

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
