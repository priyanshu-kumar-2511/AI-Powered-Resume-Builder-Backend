version: '3.8'

services:
  # Infrastructure Services
  mysql:
    image: mysql:8.0
    container_name: airesume-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: airesume
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - airesume-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: airesume-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - airesume-network

  redis:
    image: redis:latest
    container_name: airesume-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - airesume-network

  zipkin:
    image: openzipkin/zipkin
    container_name: airesume-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - airesume-network

  # Core Services
  eureka-server:
    image: priyanshu2511/airesume-eureka-server:latest
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    env_file: .env
    networks:
      - airesume-network

  config-server:
    image: priyanshu2511/airesume-config-server:latest
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    env_file: .env
    depends_on:
      - rabbitmq
      - eureka-server
    networks:
      - airesume-network

  api-gateway:
    image: priyanshu2511/airesume-api-gateway:latest
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SERVER_MAX_HTTP_REQUEST_HEADER_SIZE=65536
    env_file: .env
    depends_on:
      - eureka-server
      - config-server
    networks:
      - airesume-network

  # Microservices
  auth-service:
    image: priyanshu2511/airesume-auth-service:latest
    container_name: auth-service
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/airesume_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SERVER_MAX_HTTP_REQUEST_HEADER_SIZE=65536
    env_file: .env
    depends_on:
      - mysql
      - eureka-server
      - config-server
    networks:
      - airesume-network

  ai-service:
    image: priyanshu2511/airesume-ai-service:latest
    container_name: ai-service
    restart: unless-stopped
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    env_file: .env
    depends_on:
      - eureka-server
      - config-server
    networks:
      - airesume-network

  resume-service:
    image: priyanshu2511/airesume-resume-service:latest
    container_name: resume-service
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/airesume_resume?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    env_file: .env
    depends_on:
      - mysql
      - eureka-server
      - config-server
    networks:
      - airesume-network

  template-service:
    image: priyanshu2511/airesume-template-service:latest
    container_name: template-service
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/airesume_templates?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    env_file: .env
    depends_on:
      - mysql
      - eureka-server
      - config-server
    networks:
      - airesume-network

  export-service:
    image: priyanshu2511/airesume-export-service:latest
    container_name: export-service
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/airesume_export?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    env_file: .env
    depends_on:
      - eureka-server
      - config-server
    networks:
      - airesume-network

  notification-service:
    image: priyanshu2511/airesume-notification-service:latest
    container_name: notification-service
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/airesume_notification?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    env_file: .env
    depends_on:
      - eureka-server
      - config-server
    networks:
      - airesume-network

  payment-service:
    image: priyanshu2511/airesume-payment-service:latest
    container_name: payment-service
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/airesume_payment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    env_file: .env
    depends_on:
      - eureka-server
      - config-server
    networks:
      - airesume-network

  section-service:
    image: priyanshu2511/airesume-section-service:latest
    container_name: section-service
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/airesume_section?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    env_file: .env
    depends_on:
      - mysql
      - eureka-server
      - config-server
    networks:
      - airesume-network

  admin-server:
    image: priyanshu2511/airesume-admin-server:latest
    container_name: admin-server
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    env_file: .env
    depends_on:
      - eureka-server
      - config-server
    networks:
      - airesume-network

  # Frontend Service
  frontend:
    image: priyanshu2511/airesume-frontend:latest
    container_name: airesume-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    env_file: .env
    depends_on:
      - api-gateway
    networks:
      - airesume-network

networks:
  airesume-network:
    driver: bridge

volumes:
  mysql_data:
