server:
  port: 8888

spring:
  application:
    name: CONFIG-SERVER
  profiles:
    # 'native' means config files are read from the local classpath (no Git repo needed)
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

# Admin Server discovers this service automatically via Eureka - no admin client needed here
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    appname: CONFIG-SERVER

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always