services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../init-db.sql:/docker-entrypoint-initdb.d/00-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - airesume-network

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - airesume-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - airesume-network

  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: eureka-server
    restart: unless-stopped
    environment:
      ADMIN_SERVER_URL: http://admin-server:9090
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      EUREKA_BASE_URL: http://eureka-server:8761
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    ports:
      - "8761:8761"
    networks:
      - airesume-network

  admin-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: admin-server
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_started
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    ports:
      - "9090:9090"
    networks:
      - airesume-network

  config-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: config-server
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    ports:
      - "8888:8888"
    networks:
      - airesume-network

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: auth-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
      admin-server:
        condition: service_started
      config-server:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      ADMIN_SERVER_URL: http://admin-server:9090
      AUTH_SERVICE_URL: http://auth-service:8081
      API_GATEWAY_URL: ${API_GATEWAY_URL:-http://localhost:8080}
      APP_FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:4200}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      AUTH_MAIL_HOST: ${AUTH_MAIL_HOST:-smtp.gmail.com}
      AUTH_MAIL_PORT: ${AUTH_MAIL_PORT:-587}
      AUTH_MAIL_USERNAME: ${AUTH_MAIL_USERNAME:-}
      AUTH_MAIL_PASSWORD: ${AUTH_MAIL_PASSWORD:-}
      AUTH_DB_HOST: mysql
      AUTH_DB_PORT: 3306
      AUTH_DB_NAME: ${AUTH_DB_NAME:-airesume_auth}
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME:-root}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "8081:8081"
    networks:
      - airesume-network

  template-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: template-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
      admin-server:
        condition: service_started
      config-server:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      ADMIN_SERVER_URL: http://admin-server:9090
      TEMPLATE_SERVICE_URL: http://template-service:8082
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      TEMPLATE_DB_HOST: mysql
      TEMPLATE_DB_PORT: 3306
      TEMPLATE_DB_NAME: ${TEMPLATE_DB_NAME:-airesume_templates}
      TEMPLATE_DB_USERNAME: ${TEMPLATE_DB_USERNAME:-root}
      TEMPLATE_DB_PASSWORD: ${TEMPLATE_DB_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
    ports:
      - "8082:8082"
    networks:
      - airesume-network

  resume-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: resume-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      RESUME_DB_HOST: mysql
      RESUME_DB_PORT: 3306
      RESUME_DB_NAME: ${RESUME_DB_NAME:-airesume_resume}
      RESUME_DB_USERNAME: ${RESUME_DB_USERNAME:-root}
      RESUME_DB_PASSWORD: ${RESUME_DB_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "8083:8083"
    networks:
      - airesume-network

  section-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: section-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SECTION_DB_HOST: mysql
      SECTION_DB_PORT: 3306
      SECTION_DB_NAME: ${SECTION_DB_NAME:-airesume_section}
      SECTION_DB_USERNAME: ${SECTION_DB_USERNAME:-root}
      SECTION_DB_PASSWORD: ${SECTION_DB_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "8084:8084"
    networks:
      - airesume-network

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: ai-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      AI_DB_HOST: mysql
      AI_DB_PORT: 3306
      AI_DB_NAME: ${AI_DB_NAME:-airesume_ai}
      AI_DB_USERNAME: ${AI_DB_USERNAME:-root}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-root}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "8085:8085"
    networks:
      - airesume-network

  export-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: export-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EXPORT_DB_HOST: mysql
      EXPORT_DB_PORT: 3306
      EXPORT_DB_NAME: ${EXPORT_DB_NAME:-airesume_export}
      EXPORT_DB_USERNAME: ${EXPORT_DB_USERNAME:-root}
      EXPORT_DB_PASSWORD: ${EXPORT_DB_PASSWORD:-root}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "8086:8086"
    networks:
      - airesume-network

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: notification-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      NOTIFICATION_DB_HOST: mysql
      NOTIFICATION_DB_PORT: 3306
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:-airesume_notification}
      NOTIFICATION_DB_USERNAME: ${NOTIFICATION_DB_USERNAME:-root}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-root}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      AUTH_MAIL_HOST: ${AUTH_MAIL_HOST:-smtp.gmail.com}
      AUTH_MAIL_PORT: ${AUTH_MAIL_PORT:-587}
      AUTH_MAIL_USERNAME: ${AUTH_MAIL_USERNAME:-}
      AUTH_MAIL_PASSWORD: ${AUTH_MAIL_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "8087:8087"
    networks:
      - airesume-network

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: payment-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      PAYMENT_DB_HOST: mysql
      PAYMENT_DB_PORT: 3306
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-airesume_payment}
      PAYMENT_DB_USERNAME: ${PAYMENT_DB_USERNAME:-root}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-root}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "8088:8088"
    networks:
      - airesume-network

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: api-gateway
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_started
      auth-service:
        condition: service_started
      template-service:
        condition: service_started
      resume-service:
        condition: service_started
      section-service:
        condition: service_started
      ai-service:
        condition: service_started
      export-service:
        condition: service_started
      notification-service:
        condition: service_started
      payment-service:
        condition: service_started
      config-server:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      FRONTEND_PUBLIC_ORIGIN: ${FRONTEND_PUBLIC_ORIGIN:-http://localhost:4200}
      FRONTEND_PUBLIC_ORIGIN_ALT: ${FRONTEND_PUBLIC_ORIGIN_ALT:-http://127.0.0.1:4200}
      AUTH_SERVICE_URI: http://auth-service:8081
      NOTIFICATION_SERVICE_URI: http://notification-service:8087
    ports:
      - "8080:8080"
    networks:
      - airesume-network

  frontend:
    build:
      context: ../AI-Resume-Builder-Frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "4200:80"
    networks:
      - airesume-network

volumes:
  mysql-data:

networks:
  airesume-network:
