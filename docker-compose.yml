services:
  mysql:
    image: mysql:8.4
    container_name: airesume-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../init-db.sql:/docker-entrypoint-initdb.d/00-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - airesume-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: airesume-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - airesume-network

  redis:
    image: redis:7-alpine
    container_name: airesume-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - airesume-network

  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: eureka-server
    container_name: eureka-server
    restart: unless-stopped
    environment:
      ADMIN_SERVER_URL: http://admin-server:9090
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      EUREKA_BASE_URL: http://eureka-server:8761
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    env_file: .env
    ports:
      - "8761:8761"
    networks:
      - airesume-network

  admin-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: admin-server
    container_name: admin-server
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_started
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    env_file: .env
    ports:
      - "9090:9090"
    networks:
      - airesume-network

  config-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: config-server
    container_name: config-server
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    env_file: .env
    ports:
      - "8888:8888"
    networks:
      - airesume-network

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: auth-service
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      AUTH_DB_HOST: mysql
      AUTH_DB_PORT: 3306
    env_file: .env
    ports:
      - "8081:8081"
    networks:
      - airesume-network

  template-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: template-service
    container_name: template-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      TEMPLATE_DB_HOST: mysql
      TEMPLATE_DB_PORT: 3306
    env_file: .env
    ports:
      - "8082:8082"
    networks:
      - airesume-network

  resume-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: resume-service
    container_name: resume-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      RESUME_DB_HOST: mysql
      RESUME_DB_PORT: 3306
    env_file: .env
    ports:
      - "8083:8083"
    networks:
      - airesume-network

  section-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: section-service
    container_name: section-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SECTION_DB_HOST: mysql
      SECTION_DB_PORT: 3306
    env_file: .env
    ports:
      - "8084:8084"
    networks:
      - airesume-network

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: ai-service
    container_name: ai-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      AI_DB_HOST: mysql
      AI_DB_PORT: 3306
    env_file: .env
    ports:
      - "8085:8085"
    networks:
      - airesume-network

  export-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: export-service
    container_name: export-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EXPORT_DB_HOST: mysql
      EXPORT_DB_PORT: 3306
    env_file: .env
    ports:
      - "8086:8086"
    networks:
      - airesume-network

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: notification-service
    container_name: notification-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      NOTIFICATION_DB_HOST: mysql
      NOTIFICATION_DB_PORT: 3306
    env_file: .env
    ports:
      - "8087:8087"
    networks:
      - airesume-network

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: payment-service
    container_name: payment-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      PAYMENT_DB_HOST: mysql
      PAYMENT_DB_PORT: 3306
    env_file: .env
    ports:
      - "8088:8088"
    networks:
      - airesume-network

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: api-gateway
    container_name: api-gateway
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_started
      auth-service:
        condition: service_started
      template-service:
        condition: service_started
      resume-service:
        condition: service_started
      section-service:
        condition: service_started
      ai-service:
        condition: service_started
      export-service:
        condition: service_started
      notification-service:
        condition: service_started
      payment-service:
        condition: service_started
      config-server:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      AUTH_SERVICE_URI: http://auth-service:8081
      NOTIFICATION_SERVICE_URI: http://notification-service:8087
    env_file: .env
    ports:
      - "8080:8080"
    networks:
      - airesume-network

  frontend:
    build:
      context: ../AI-Resume-Builder-Frontend
      dockerfile: Dockerfile
    container_name: airesume-frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
    env_file: .env
    ports:
      - "4200:80"
    networks:
      - airesume-network

volumes:
  mysql-data:

networks:
  airesume-network:
