server:
  port: 8081

spring:
  application:
    name: AUTH-SERVICE
  boot:
    admin:
      client:
        url: http://localhost:9090
        username: admin
        password: admin123
        instance:
          service-base-url: http://localhost:8081
          name: AUTH-SERVICE
  
  # Configuration Management
  config:
    # Pull infrastructure config from Config Server
    import: optional:configserver:http://localhost:8888
  
  # Persistence Layer with Auto-DB Creation
  datasource:
    url: jdbc:mysql://${AUTH_DB_HOST:localhost}:3306/${AUTH_DB_NAME:airesume_auth}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true
    username: ${AUTH_DB_USERNAME:root}
    password: ${AUTH_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Mail Configuration
  mail:
    host: ${AUTH_MAIL_HOST:smtp.gmail.com}
    port: ${AUTH_MAIL_PORT:587}
    username: ${AUTH_MAIL_USERNAME:your-email@gmail.com}
    password: ${AUTH_MAIL_PASSWORD:your-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Service Discovery
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    hostname: localhost
    non-secure-port: 8081
    instance-id: ${spring.application.name}:${server.port}
    appname: AUTH-SERVICE

# Monitoring & Documentation
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# Swagger Documentation
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Security Secret
app:
  jwt:
    secret: ${AUTH_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: ${AUTH_JWT_EXPIRATION:86400000} # 24 hours
