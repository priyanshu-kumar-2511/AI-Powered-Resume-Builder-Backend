server:
  port: 0

spring:
  application:
    name: AUTH-SERVICE-TEST
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-google-id
            client-secret: dummy-google-secret
          linkedin:
            client-id: dummy-linkedin-id
            client-secret: dummy-linkedin-secret
            client-name: LinkedIn
            provider: linkedin
            redirect-uri: "http://localhost:8080/login/oauth2/code/linkedin"
            authorization-grant-type: authorization_code
        provider:
          linkedin:
            authorization-uri: https://www.linkedin.com/oauth/v2/authorization
            token-uri: https://www.linkedin.com/oauth/v2/accessToken
            user-info-uri: https://api.linkedin.com/v2/userinfo
            jwk-set-uri: https://www.linkedin.com/oauth/openid/jwks
            user-name-attribute: sub
  
  cloud:
    config:
      enabled: false
  
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  
  sql:
    init:
      mode: never

  cache:
    type: none

  mail:
    host: localhost
    port: 25
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

eureka:
  client:
    enabled: false

app:
  jwt:
    secret: test-secret-key-for-unit-tests-only-32chars!!
    expiration: 86400000
